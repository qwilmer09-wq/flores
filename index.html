<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #020206;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* PANTALLA 1: EL SOBRE INTERACTIVO */
        #pantalla-carta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .sobre {
            font-size: 130px;
            line-height: 1;
            filter: drop-shadow(0 10px 25px rgba(255, 215, 0, 0.3));
            animation: flotarCarta 2.5s infinite ease-in-out;
            user-select: none;
        }
        .indicacion {
            margin-top: 25px;
            font-size: 14px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
            user-select: none;
        }

        /* PANTALLA 2: EL UNIVERSO CÓSMICO (ESTILO TIKTOK) */
        #pantalla-flores {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a061c 0%, #010103 100%);
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        /* Fondo de Estrellas del Universo */
        .estrellas-espaciales {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1.5px, transparent 40px),
                radial-gradient(rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 300px 300px, 200px 200px;
            background-position: 0 0, 50px 50px;
            opacity: 0.6;
            z-index: 1;
        }

        /* EL NÚCLEO OSCURO CON ANILLO DE NEÓN AMARILLO */
        .universo-centro {
            position: absolute;
            width: 290px;
            height: 290px;
            background: #040307; /* Centro negro profundo */
            border-radius: 50%;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Anillo resplandeciente amarillo del video */
            box-shadow: 0 0 40px #ffcc00, 0 0 80px #ff9900, inset 0 0 20px rgba(255,204,0,0.3);
            border: 2px solid rgba(255, 204, 0, 0.6);
            animation: zoomUniverso 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
        }

        /* LETRERO SUPERIOR FLOTANTE */
        .titulo-galaxia {
            position: absolute;
            top: 10%;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            text-shadow: 0 0 8px #ffcc00, 0 0 20px #ff9900;
            width: 90%;
            animation: aparecerTexto 2s ease-out forwards;
        }

        /* DEDICATORIA INTERNA */
        .texto-central {
            text-align: center;
            max-width: 230px;
            padding: 15px;
            z-index: 6;
            animation: aparecerTexto 2.6s ease-out forwards;
        }
        .texto-central p {
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.6;
            margin: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* LLUVIA CÓSMICA DE GIRASOLES */
        .girasol-volador {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 2; /* Caen por detrás del anillo oscuro */
            animation: caídaCósmica linear infinite;
        }

        /* ANIMACIONES */
        @keyframes flotarCarta {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes zoomUniverso {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes aparecerTexto {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes caídaCósmica {
            0% {
                transform: translateY(-60px) rotate(0deg) scale(0.7);
                opacity: 0;
            }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1 -->
    <div id="pantalla-carta">
        <div class="sobre">✉️</div>
        <div class="indicacion">Toca para abrir tu sorpresa ✨</div>
    </div>

    <!-- PANTALLA 2: EL UNIVERSO DE FLORES -->
    <div id="pantalla-flores">
        <div class="estrellas-espaciales"></div>
        <div class="titulo-galaxia">Feliz Día de las Flores Amarillas</div>
        
        <div class="universo-centro">
            <div class="texto-central">
                <p>Un universo entero lleno de estrellas y girasoles diseñado especialmente para ti. Para recordarte lo valiosa, única e increíble que eres. ¡Nunca dejes de brillar! 🌻✨</p>
            </div>
        </div>
    </div>

    <script>
        const disparador = document.getElementById('pantalla-carta');
        
        disparador.addEventListener('click', function() {
            disparador.style.display = 'none';
            
            const pantallaUniverso = document.getElementById('pantalla-flores');
            pantallaUniverso.style.display = 'flex';

            // Emojis exactos para la lluvia cósmica
            const cosmosElementos = ['🌻', '🌻', '🌼', '✨', '💛', '⭐'];

            for (let i = 0; i < 85; i++) {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.classList.add('girasol-volador');
                    item.innerText = cosmosElementos[Math.floor(Math.random() * cosmosElementos.length)];
                    
                    item.style.left = Math.random() * 100 + 'vw';
                    
                    const escala = Math.random() * 24 + 16;
                    item.style.fontSize = escala + 'px';
                    item.style.animationDuration = (Math.random() * 3.5 + 3.5) + 's';
                    
                    // Efecto de brillo de neón en cada flor/estrella cayendo
                    item.style.filter = 'drop-shadow(0 0 8px rgba(255,204,0,0.8))';

                    pantallaUniverso.appendChild(item);
                }, i * 100);
            }
        });
    </script>
</body>
</html>
