<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Cósmica de Flores Amarillas</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #010104;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* PANTALLA 1: EL SOBRE INTERACTIVO */
        #pantalla-carta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .sobre {
            font-size: 130px;
            line-height: 1;
            filter: drop-shadow(0 10px 25px rgba(255, 215, 0, 0.4));
            animation: flotarCarta 2.5s infinite ease-in-out;
            user-select: none;
        }
        .indicacion {
            margin-top: 25px;
            font-size: 14px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
            user-select: none;
        }

        /* PANTALLA 2: LA GALAXIA INFINITA DE FLORES */
        #pantalla-flores {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0f082c 0%, #010105 100%);
            overflow: hidden;
        }

        /* Capa de Estrellas de Fondo */
        .estrellas-fondo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1.5px, transparent 40px),
                radial-gradient(rgba(255,204,0,.2) 1px, transparent 30px);
            background-size: 300px 300px, 200px 200px;
            opacity: 0.7;
            z-index: 1;
        }

        /* ELEMENTOS DE LA GALAXIA: FLORES, RAMOS Y DESTELLOS */
        .objeto-galaxia {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 2;
            animation: orbitaCosmica linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 204, 0, 0.85));
        }

        /* FRASES VOLADORAS ESTILO NEÓN */
        .frase-galaxia {
            position: absolute;
            color: #ffffff;
            font-weight: 700;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            z-index: 3;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #ffcc00, 0 0 20px #ff9900, 0 0 30px #ff6600;
            animation: orbitaCosmica linear infinite;
        }

        /* ANIMACIONES ESPACIALES */
        @keyframes flotarCarta {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Movimiento combinado: Avanzan, rotan en 3D y giran en su propio eje */
        @keyframes orbitaCosmica {
            0% {
                transform: translate(var(--x-inicio), -10vh) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translate(var(--x-fin), 110vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1 -->
    <div id="pantalla-carta">
        <div class="sobre">✉️</div>
        <div class="indicacion">Toca para abrir tu galaxia ✨</div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="pantalla-flores">
        <div class="estrellas-fondo"></div>
    </div>

    <script>
        const disparador = document.getElementById('pantalla-carta');
        
        disparador.addEventListener('click', function() {
            disparador.style.display = 'none';
            
            const galaxia = document.getElementById('pantalla-flores');
            galaxia.style.display = 'block';

            // 1. GENERACIÓN DE FLORES, DESTELLOS Y RAMOS COMO EN EL VIDEO
            const iconosFlores = ['🌻', '💐', '🌼', '✨', '💛', '🌟', '💐', '🌻'];
            
            for (let i = 0; i < 110; i++) {
                setTimeout(() => {
                    const item = document.createElement('div');
                    item.classList.add('objeto-galaxia');
                    item.innerText = iconosFlores[Math.floor(Math.random() * iconosFlores.length)];
                    
                    // Configuración de rutas espaciales cruzadas
                    const xInicio = Math.random() * 100;
                    const xFin = xInicio + (Math.random() * 30 - 15); // Desplazamiento oblicuo
                    
                    item.style.setProperty('--x-inicio', xInicio + 'vw');
                    item.style.setProperty('--x-fin', xFin + 'vw');
                    item.style.left = '0';
                    
                    // Tamaños variados para profundidad espacial
                    const tamano = Math.random() * 28 + 18;
                    item.style.fontSize = tamano + 'px';
                    
                    // Velocidades en órbita
                    item.style.animationDuration = (Math.random() * 4 + 4) + 's';

                    galaxia.appendChild(item);
                }, i * 70); // Salen de manera continua y masiva
            }

            // 2. GENERACIÓN DE LAS FRASES QUE VAN GIRANDO
            const frasesTiktok = [
                "Feliz día de las Flores Amarillas 🌻",
                "Eres mi persona favorita ✨",
                "Nunca dejes de brillar 💛",
                "Te amo un universo entero 🌟",
                "Un detalle especial para ti 💐",
                "Siempre juntos 💕",
                "Iluminas mi mundo 🌼"
            ];

            for (let j = 0; j < 25; j++) {
                setTimeout(() => {
                    const frase = document.createElement('div');
                    frase.classList.add('frase-galaxia');
                    frase.innerText = frasesTiktok[j % frasesTiktok.length];
                    
                    const xInicio = Math.random() * 80;
                    const xFin = xInicio + (Math.random() * 20 - 10);
                    
                    frase.style.setProperty('--x-inicio', xInicio + 'vw');
                    frase.style.setProperty('--x-fin', xFin + 'vw');
                    frase.style.left = '0';
                    
                    // Tamaños de texto adaptables para móviles
                    frase.style.fontSize = (Math.random() * 5 + 14) + 'px';
                    frase.style.animationDuration = (Math.random() * 3 + 5) + 's';

                    galaxia.appendChild(frase);
                }, j * 400); // Aparecen de forma escalonada entre la lluvia cósmica
            }
        });
    </script>
</body>
</html>
