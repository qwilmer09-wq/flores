<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Flores 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020208;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            perspective: 1000px; /* Activa la perspectiva 3D global */
        }

        /* Pantalla 1: La Carta Flotante */
        #pantalla-carta {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #pantalla-carta:hover {
            transform: scale(1.1) rotateY(10deg);
        }
        .sobre {
            font-size: 140px;
            line-height: 1;
            filter: drop-shadow(0 15px 25px rgba(255, 215, 0, 0.3));
            animation: flotarCarta 3s infinite ease-in-out;
        }
        .indicacion {
            margin-top: 25px;
            font-size: 15px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* Pantalla 2: El Universo Cósmico */
        #pantalla-flores {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #11092c 0%, #03020a 100%);
            overflow: hidden;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* Fondo de Estrellas Fijas con Profundidad */
        .estrellas {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
            z-index: 1;
        }

        /* El Anillo de Energía de la Galaxia en 3D */
        .anillo-3d {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 3px dashed #ffcc00;
            box-shadow: 0 0 50px #ffaa00, inset 0 0 30px #ff3300;
            filter: blur(1px);
            z-index: 2;
            transform: rotateX(65deg) rotateY(15deg); /* Tumbado en el espacio */
            animation: rotarAnillo 15s linear infinite;
        }

        /* El Núcleo de la Galaxia (Círculo Negro del Video) */
        .nucleo-galaxia {
            position: absolute;
            width: 250px;
            height: 250px;
            background: #050409;
            border-radius: 50%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.4);
            border: 2px solid #ffcc00;
            animation: escalaNucleo 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .mensaje-interno {
            padding: 20px;
            text-align: center;
            max-width: 210px;
        }
        .mensaje-interno h1 {
            color: #ffffff;
            font-size: 18px;
            margin: 0 0 8px 0;
            text-shadow: 0 0 8px #ffcc00;
        }
        .mensaje-interno p {
            color: #e2d9ff;
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
        }

        /* Flores que Caen y Orbitan en el Espacio */
        .elemento-espacial {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 4;
            animation: lluviaEspacial linear infinite;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.7));
        }

        /* Animaciones Mágicas */
        @keyframes flotarCarta {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        @keyframes rotarAnillo {
            from { transform: rotateX(65deg) rotateY(15deg) rotate(0deg); }
            to { transform: rotateX(65deg) rotateY(15deg) rotate(360deg); }
        }
        @keyframes escalaNucleo {
            from { transform: scale(0) rotate(-180deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes lluviaEspacial {
            0% {
                transform: translateY(-10vh) translateX(0) translateZ(-400px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                /* El translateZ genera el efecto óptico de que avanzan hacia la pantalla en 3D */
                transform: translateY(110vh) translateX(100px) translateZ(400px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1 -->
    <div id="pantalla-carta" onclick="abrirCarta()">
        <div class="sobre">✉️</div>
        <div class="indicacion">Toca para abrir tu sorpresa ✨</div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="pantalla-flores">
        <div class="estrellas"></div>
        <div class="anillo-3d"></div>
        
        <div class="nucleo-galaxia">
            <div class="mensaje-interno">
                <h1>¡Feliz Día! 🌻</h1>
                <p>Te envío este universo brillante para recordarte lo especial que eres. Que tu vida esté siempre llena de luz y sonrisas. ✨</p>
            </div>
        </div>
    </div>

    <script>
        function abrirCarta() {
            document.getElementById('pantalla-carta').style.display = 'none';
            const contenedor = document.getElementById('pantalla-flores');
            contenedor.style.display = 'flex';

            const objetos = ['🌻', '🌼', '✨', '💛', '🌟'];

            // Creamos 90 elementos distribuidos aleatoriamente en el espacio 3D
            for (let i = 0; i < 90; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.classList.add('elemento-espacial');
                    el.innerText = objetos[Math.floor(Math.random() * objetos.length)];
                    
                    // Dispersión horizontal
                    el.style.left = Math.random() * 100 + 'vw';
                    
                    // Tamaños aleatorios
                    const tamano = Math.random() * 25 + 15;
                    el.style.fontSize = tamano + 'px';
                    
                    // Tiempos de caída desordenados para dar profundidad real
                    el.style.animationDuration = (Math.random() * 4 + 3)s;
                    
                    // Retraso de animación personalizado
                    el.style.animationDelay = (Math.random() * 2) + 's';

                    contenedor.appendChild(el);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
