<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas 3D</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #010103;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* PANTALLA 1: EL SOBRE */
        #pantalla-carta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .sobre {
            font-size: 130px;
            line-height: 1;
            filter: drop-shadow(0 10px 25px rgba(255, 204, 0, 0.4));
            animation: flotarCarta 2.5s infinite ease-in-out;
        }
        .indicacion {
            margin-top: 25px;
            font-size: 14px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* PANTALLA 2: EL UNIVERSO SATURNO */
        #pantalla-flores {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020105;
            overflow: hidden;
        }

        /* TEXTO SUPERIOR FIJO */
        .titulo-superior {
            position: absolute;
            top: 6%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            z-index: 500;
            letter-spacing: 1px;
            text-shadow: 0 0 12px #ffcc00, 0 0 25px #ffaa00;
            line-height: 1.4;
        }

        /* FONDO ESTRELLADO ESTÁTICO */
        .estrellas-fondo {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 20px),
                radial-gradient(rgba(255,255,255,.15) 1px, transparent 15px);
            background-size: 200px 200px, 130px 130px;
            opacity: 0.4;
            z-index: 1;
        }

        /* ESCENARIO DE ÓRBITA */
        .espacio-central {
            position: absolute;
            top: 55%;
            left: 50%;
            width: 400px;
            height: 400px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PLANETA CENTRAL (SATURNO NEGRO) */
        .saturno-nucleo {
            position: absolute;
            width: 110px;
            height: 110px;
            background: #040306;
            border-radius: 50%;
            z-index: 100; /* Capa intermedia clave */
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.4), inset -12px -12px 25px rgba(0,0,0,0.95);
            border: 1px solid rgba(255,204,0,0.25);
        }

        /* EL ANILLO INCLINADO FLUIDO */
        .saturno-anillo {
            position: absolute;
            width: 330px;
            height: 120px; /* Aplastado verticalmente para simular inclinación 3D */
            border: 24px solid #ffee7c;
            border-radius: 50%;
            z-index: 90; /* Se dibuja justo bajo el planeta */
            box-shadow: 0 0 45px #ffbb00, inset 0 0 30px #ff7700;
            filter: drop-shadow(0 0 10px rgba(255,165,0,0.5));
            pointer-events: none;
        }

        /* ELEMENTOS ORBITALES (TEXTOS, FLORES, ESTRELLAS CERCANAS) */
        .orbital-item {
            position: absolute;
            color: #ffffff;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 8px #ffcc00, 0 0 15px #ff8800;
            pointer-events: none;
            user-select: none;
        }

        @keyframes flotarCarta {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1 -->
    <div id="pantalla-carta">
        <div class="sobre">✉️</div>
        <div class="indicacion">Toca para abrir tu galaxia ✨</div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="pantalla-flores">
        <div class="estrellas-fondo"></div>
        <div class="titulo-superior">Feliz día de las<br>Flores Amarillas 🌻</div>
        
        <div class="espacio-central">
            <div class="saturno-nucleo"></div>
            <div class="saturno-anillo"></div>
            <!-- Aquí se inyectan los elementos que orbitan -->
        </div>
    </div>

    <script>
        const disparador = document.getElementById('pantalla-carta');
        
        disparador.addEventListener('click', function() {
            disparador.style.display = 'none';
            
            const universo = document.getElementById('pantalla-flores');
            universo.style.display = 'block';

            const espacio = document.querySelector('.espacio-central');

            // Listado de frases y elementos visuales de tu imagen
            const datosOrbita = [
                "Pura luz ✨", "Luz en mi vida", "Sonríe siempre 🌻", "Feliz día", 
                "Solo para ti 💛", "Flores para ti", "Alegras mi vida", "💐 Ramo Especial",
                "🌻 Girasol", "✨ Destello", "Mi amor 💛", "Eres magia 🌟",
                "Un detalle amarillo", "Sonríe siempre 🌻", "Feliz día 🌼", "🌻", "✨", "💛", "⭐"
            ];

            const elementosCreados = [];
            const centroX = 200; // Mitad del contenedor espacio-central
            const centroY = 200;

            // Generación de 50 elementos orbitando en un plano elíptico real
            for (let i = 0; i < 50; i++) {
                const item = document.createElement('div');
                item.classList.add('orbital-item');
                item.innerText = datosOrbita[i % datosOrbita.length];
                
                // Distribución de radios horizontales y verticales (Órbita elíptica)
                const radioX = Math.random() * 60 + 130; 
                const radioY = radioX * 0.38; // Relación idéntica al aplastamiento del anillo
                
                // Ángulo inicial aleatorio para que estén esparcidos por toda la elipse
                const anguloInicial = Math.random() * Math.PI * 2;
                
                // Velocidad de rotación única por elemento
                const velocidad = Math.random() * 0.015 + 0.01; 
                
                // Tamaño de letra variado
                item.style.fontSize = (Math.random() * 5 + 11) + 'px';

                espacio.appendChild(item);

                elementosCreados.push({
                    elemento: item,
                    radioX: radioX,
                    radioY: radioY,
                    angulo: anguloInicial,
                    velocidad: velocidad
                });
            }

            // Bucle matemático de animación por milisegundos (Motor 3D Real)
            function animarOrbita() {
                elementosCreados.forEach(obj => {
                    obj.angulo += obj.velocidad; // Incrementa el ángulo de giro

                    // Calcula coordenadas X e Y en la elipse
                    const x = centroX + Math.cos(obj.angulo) * obj.radioX;
                    const y = centroY + Math.sin(obj.angulo) * obj.radioY;

                    // Centra las etiquetas de texto con un desfase
                    obj.elemento.style.left = (x - 30) + 'px';
                    obj.elemento.style.top = (y - 10) + 'px';

                    // EL TRUCO DEL VIDEO: Efecto de pasar por detrás o por delante
                    // Si el seno es negativo, el objeto está en la mitad superior de la órbita (detrás del planeta)
                    if (Math.sin(obj.angulo) < 0) {
                        obj.elemento.style.zIndex = "50";   // Detrás de Saturno (que tiene z-index: 100)
                        obj.elemento.style.opacity = "0.6";  // Se atenúa ligeramente en el fondo
                    } else {
                        obj.elemento.style.zIndex = "200";  // Delante de Saturno
                        obj.elemento.style.opacity = "1";    // Brillo total al estar al frente
                    }
                });

                requestAnimationFrame(animarOrbita);
            }

            // Arranca el motor de animación
            animarOrbita();
        });
    </script>
</body>
</html>
