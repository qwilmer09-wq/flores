<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #030208;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* PANTALLA 1: EL SOBRE PARA HACER CLIC */
        #pantalla-carta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .sobre {
            font-size: 130px;
            line-height: 1;
            filter: drop-shadow(0 10px 20px rgba(255, 215, 0, 0.4));
            animation: flotarCarta 2.5s infinite ease-in-out;
            user-select: none;
        }
        .indicacion {
            margin-top: 25px;
            font-size: 14px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            user-select: none;
        }

        /* PANTALLA 2: LA GALAXIA ESPACIAL (OCULTA) */
        #pantalla-flores {
            display: none; /* Se activa con JS */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #160a3a 0%, #020107 100%);
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        /* Fondo Cósmico de Estrellas */
        .estrellas {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(rgba(255,215,0,.3), rgba(255,215,0,.05) 1px, transparent 30px);
            background-size: 400px 400px, 250px 250px;
            opacity: 0.5;
            z-index: 1;
        }

        /* EL SOL/ESFERA DORADA 3D ASCENDENTE */
        .sol-3d {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffea6c 30%, #ffb600 70%, #965300 100%);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 60px #ffcc00, 0 0 120px #ff6600, inset -10px -10px 30px rgba(0,0,0,0.5);
            animation: ascenderSol 2s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
        }

        /* LETRERO DE NEÓN SUPERIOR */
        .letrero-neon {
            position: absolute;
            top: 12%;
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffaa00, 0 0 40px #ff3300;
            width: 90%;
            animation: aparecerTexto 2s ease-out forwards;
        }

        /* TEXTO DENTRO DEL SOL */
        .dedicatoria {
            position: absolute;
            z-index: 5;
            text-align: center;
            max-width: 220px;
            padding: 10px;
            pointer-events: none;
            animation: aparecerTexto 2.5s ease-out forwards;
        }
        .dedicatoria p {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* LLUVIA DE FLORES Y ELEMENTOS */
        .flor-girasol {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 4;
            animation: caerFlor linear infinite;
        }

        /* ANIMACIONES */
        @keyframes flotarCarta {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes ascenderSol {
            from { transform: translateY(100vh) scale(0.5); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes aparecerTexto {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes caerFlor {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1: DETONADOR DE LA CARTA -->
    <div id="pantalla-carta">
        <div class="sobre">✉️</div>
        <div class="indicacion">Toca para abrir tu sorpresa ✨</div>
    </div>

    <!-- PANTALLA 2: EFECTO TIKTOK ALEXDEV -->
    <div id="pantalla-flores">
        <div class="estrellas"></div>
        <div class="letrero-neon">Feliz Día de las Flores Amarillas</div>
        <div class="sol-3d"></div>
        
        <div class="dedicatoria">
            <p>Un universo de luz y girasoles para recordarte lo increíble y especial que eres. ¡Nunca dejes de brillar! 🌻✨</p>
        </div>
    </div>

    <script>
        // Corrección absoluta del evento de clic para móviles
        const botonCarta = document.getElementById('pantalla-carta');
        
        botonCarta.addEventListener('click', function() {
            // Ocultar pantalla de la carta
            botonCarta.style.display = 'none';
            
            // Mostrar la galaxia de flores
            const galaxia = document.getElementById('pantalla-flores');
            galaxia.style.display = 'flex';

            // Emojis temáticos del video
            const elementos = ['🌻', '🌻', '🌼', '✨', '💛'];

            // Crear ráfaga de flores flotantes
            for (let i = 0; i < 75; i++) {
                setTimeout(() => {
                    const flor = document.createElement('div');
                    flor.classList.add('flor-girasol');
                    flor.innerText = elementos[Math.floor(Math.random() * elementos.length)];
                    
                    // Posición horizontal aleatoria
                    flor.style.left = Math.random() * 100 + 'vw';
                    
                    // Tamaños dinámicos para simular distancias (Efecto 3D)
                    const tamano = Math.random() * 26 + 16;
                    flor.style.fontSize = tamano + 'px';
                    
                    // Velocidades de caída suaves
                    flor.style.animationDuration = (Math.random() * 4 + 3.5) + 's';
                    
                    // Desenfoque sutil en flores lejanas para realismo 3D
                    if (tamano < 20) {
                        flor.style.filter = 'blur(1px) drop-shadow(0 0 5px rgba(255,215,0,0.5))';
                    } else {
                        flor.style.filter = 'drop-shadow(0 0 8px rgba(255,215,0,0.8))';
                    }

                    galaxia.appendChild(flor);
                }, i * 110);
            }
        });
    </script>
</body>
</html>
