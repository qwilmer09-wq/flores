<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Saturno: Flores Amarillas</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #020205;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            perspective: 1200px; /* Perspectiva para el efecto 3D */
        }

        /* PANTALLA 1: EL SOBRE INTERACTIVO */
        #pantalla-carta {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .sobre {
            font-size: 130px;
            line-height: 1;
            filter: drop-shadow(0 10px 25px rgba(255, 204, 0, 0.4));
            animation: flotarCarta 2.5s infinite ease-in-out;
            user-select: none;
        }
        .indicacion {
            margin-top: 25px;
            font-size: 14px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
            user-select: none;
        }

        /* PANTALLA 2: LA GALAXIA SATURNO (ESTILO TIKTOK) */
        #pantalla-flores {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0518 0%, #010103 100%);
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* TÍTULO SUPERIOR DE LA IMAGEN */
        .titulo-superior {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            z-index: 20;
            letter-spacing: 1px;
            text-shadow: 0 0 12px #ffcc00, 0 0 25px #ffaa00;
            line-height: 1.4;
        }

        /* ESPACIO ESTRELLADO TOTAL */
        .universo-estrellas {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.3) 1.2px, transparent 30px),
                radial-gradient(rgba(255,255,255,.2) 1px, transparent 20px);
            background-size: 250px 250px, 150px 150px;
            opacity: 0.85;
            z-index: 1;
        }

        /* CONTENEDOR DE LA ORBITA CENTRAL */
        .sistema-saturno {
            position: absolute;
            top: 55%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            z-index: 5;
            transform: rotateX(72deg) rotateY(-10deg); /* Inclinación idéntica a tu foto */
        }

        /* EL PLANETA/CENTRO NEGRO */
        .esfera-negra {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #020204;
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(-72deg); /* Cancela inclinación para mantenerse esférico */
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.4), inset -10px -10px 25px rgba(0,0,0,0.9);
            z-index: 10;
            border: 1px solid rgba(255,204,0,0.2);
        }

        /* EL ANILLO AMARILLO BRILLANTE PLANO */
        .anillo-plano {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: transparent;
            border: 22px solid #ffea6c;
            box-shadow: 0 0 40px #ffcc00, inset 0 0 30px #ff9900;
            transform: translate(-50%, -50%);
            z-index: 8;
            filter: blur(1px);
        }

        /* ELEMENTOS Y FRASES EN ÓRBITA ROTATIVA */
        .particula-orbita {
            position: absolute;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            text-shadow: 0 0 8px #ffcc00, 0 0 15px #ff9900;
            transform-style: preserve-3d;
            animation: girarEnOrbita var(--tiempo) linear infinite;
            z-index: 12;
        }

        /* ANIMACIONES */
        @keyframes flotarCarta {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Efecto matemático para orbitar circularmente en 3D en base al centro */
        @keyframes girarEnOrbita {
            from {
                transform: rotateZ(0deg) translateX(var(--radio)) rotateZ(0deg) rotateX(-72deg);
            }
            to {
                transform: rotateZ(360deg) translateX(var(--radio)) rotateZ(-360deg) rotateX(-72deg);
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1 -->
    <div id="pantalla-carta">
        <div class="sobre">✉️</div>
        <div class="indicacion">Toca para abrir tu galaxia ✨</div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="pantalla-flores">
        <div class="universo-estrellas"></div>
        <div class="titulo-superior">Feliz día de las<br>Flores Amarillas 🌻</div>
        
        <!-- Sistema planetario central -->
        <div class="sistema-saturno">
            <div class="esfera-negra"></div>
            <div class="anillo-plano"></div>
            <!-- Los elementos interactivos se inyectan aquí con JS -->
        </div>
    </div>

    <script>
        const disparador = document.getElementById('pantalla-carta');
        
        disparador.addEventListener('click', function() {
            disparador.style.display = 'none';
            
            const contenedorGalaxia = document.getElementById('pantalla-flores');
            contenedorGalaxia.style.display = 'block';

            const sistema = document.querySelector('.sistema-saturno');

            // Frases exactas estilo neón que se ven flotando en tu captura
            const textosYFlores = [
                "Pura luz ✨", "Luz en mi vida", "Sonríe siempre 🌻", "Feliz día", 
                "Solo para ti 💛", "Flores para ti", "Alegras mi vida", "💐 Ramo Especial",
                "🌻 Girasol Cósmico", "Pura luz ✨", "Mi amor 💛", "Eres magia",
                "Un detalle amarillo", "Sonríe siempre 🌻", "Feliz día 🌼"
            ];

            // Generamos la nube rotativa tridimensional
            for (let i = 0; i < 45; i++) {
                const elemento = document.createElement('div');
                elemento.classList.add('particula-orbita');
                
                // Selecciona una frase o emoji del listado
                elemento.innerText = textosYFlores[i % textosYFlores.length];
                
                // Distancia desde el centro (unos más cerca del anillo, otros más lejos)
                const radioAleatorio = Math.random() * 160 + 130; 
                elemento.style.setProperty('--radio', radioAleatorio + 'px');
                
                // Velocidad de giro desordenada para simular un universo vivo (entre 8 y 18 segundos)
                const velocidad = Math.random() * 10 + 8;
                elemento.style.setProperty('--tiempo', velocidad + 's');
                
                // Retraso para que no empiecen todos amontonados en el mismo sitio
                elemento.style.animationDelay = '-' + (Math.random() * velocidad) + 's';
                
                // Tamaño de letras variado
                elemento.style.fontSize = (Math.random() * 4 + 11) + 'px';

                sistema.appendChild(elemento);
            }
        });
    </script>
</body>
</html>
