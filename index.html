<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>🌻 Feliz Día de las Flores Amarillas 🌻</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    touch-action:none;
}


/* =====================================================
   PANTALLA INICIAL
===================================================== */

#inicio{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(
        circle,
        #332000 0%,
        #080600 45%,
        #000 100%
    );

}


.sobre{

    font-size:110px;

    animation:
    flotar 2.5s
    ease-in-out
    infinite;

    filter:
    drop-shadow(0 0 15px #ffd000)
    drop-shadow(0 0 40px #ff9d00);

}


@keyframes flotar{

    0%,100%{
        transform:
        translateY(0)
        rotate(-3deg);
    }

    50%{
        transform:
        translateY(-20px)
        rotate(3deg);
    }

}


.instruccion{

    margin-top:30px;

    color:white;

    font-size:14px;

    letter-spacing:2px;

    text-transform:uppercase;

    padding:
    13px 25px;

    border-radius:30px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid
    rgba(255,210,0,.4);

    box-shadow:
    0 0 25px
    rgba(255,200,0,.25);

}


/* =====================================================
   ESCENA
===================================================== */

#escena{

    position:fixed;

    inset:0;

    display:none;

    background:#000;

}


canvas{

    position:absolute;

    inset:0;

    display:block;

}


/* =====================================================
   TITULO
===================================================== */

.titulo{

    position:absolute;

    top:4%;

    left:0;

    width:100%;

    text-align:center;

    z-index:50;

    pointer-events:none;

    color:#fffbd1;

    font-weight:900;

    font-size:
    clamp(
        27px,
        7vw,
        55px
    );

    line-height:1.25;

    text-shadow:

    0 0 5px white,

    0 0 12px #ffe100,

    0 0 25px #ffb000,

    0 0 50px #ff8c00;

    animation:
    brillo 2s
    infinite
    alternate;

}


@keyframes brillo{

    from{
        filter:brightness(.9);
    }

    to{
        filter:brightness(1.4);
    }

}


/* =====================================================
   SUBTITULO
===================================================== */

.subtitulo{

    position:absolute;

    bottom:5%;

    width:100%;

    text-align:center;

    color:
    rgba(255,255,255,.75);

    font-size:13px;

    letter-spacing:1px;

    z-index:50;

    pointer-events:none;

}


/* =====================================================
   BOTON
===================================================== */

#reiniciar{

    display:none;

    position:absolute;

    z-index:100;

    right:15px;

    bottom:15px;

    width:42px;

    height:42px;

    border-radius:50%;

    border:
    1px solid
    rgba(255,220,0,.5);

    background:
    rgba(0,0,0,.5);

    color:#ffd000;

    font-size:20px;

}

</style>

</head>


<body>


<!-- =================================================
     INICIO
================================================= -->

<div id="inicio">

    <div class="sobre">
        💌
    </div>

    <div class="instruccion">
        Toca para abrir tu sorpresa ✨
    </div>

</div>


<!-- =================================================
     ESCENA
================================================= -->

<div id="escena">


    <div class="titulo">

        🌻 FELIZ DÍA DE LAS<br>
        FLORES AMARILLAS 🌻

    </div>


    <div class="subtitulo">

        👆 Arrastra para girar · 🤏 Acerca o aleja

    </div>


</div>


<button id="reiniciar">
↻
</button>


<!-- =================================================
     THREE JS
================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
</script>


<script>


/* =====================================================
   VARIABLES
===================================================== */

let scene;

let camera;

let renderer;

let universo;

let flores=[];

let mensajes=[];

let estrellas;

let autoRotacion=true;

let arrastrando=false;

let anteriorX=0;

let anteriorY=0;

let distanciaInicial=0;

let zoomInicial=10;


/* =====================================================
   ELEMENTOS
===================================================== */

const inicio=
document.getElementById("inicio");

const pantalla=
document.getElementById("escena");

const boton=
document.getElementById("reiniciar");


/* =====================================================
   ABRIR
===================================================== */

inicio.addEventListener(
    "click",
    iniciar
);


function iniciar(){

    inicio.style.display="none";

    pantalla.style.display="block";

    boton.style.display="block";

    crearEscena();

}


/* =====================================================
   ESCENA 3D
===================================================== */

function crearEscena(){


    scene=
    new THREE.Scene();


    /* -----------------------------------------------
       CAMARA
    ------------------------------------------------ */

    camera=
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth/
        window.innerHeight,

        .1,

        1000

    );


    camera.position.set(
        0,
        5.5,
        12
    );


    camera.lookAt(
        0,
        0,
        0
    );


    /* -----------------------------------------------
       RENDER
    ------------------------------------------------ */

    renderer=
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:false

    });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputEncoding=
    THREE.sRGBEncoding;


    pantalla.appendChild(
        renderer.domElement
    );


    /* -----------------------------------------------
       FONDO
    ------------------------------------------------ */

    scene.background=
    new THREE.Color(0x000000);


    /* -----------------------------------------------
       LUCES
    ------------------------------------------------ */

    const luz1=
    new THREE.PointLight(
        0xffd000,
        5,
        35
    );

    luz1.position.set(
        0,
        5,
        5
    );

    scene.add(luz1);


    const luz2=
    new THREE.PointLight(
        0xff9900,
        3,
        25
    );

    luz2.position.set(
        -5,
        2,
        -5
    );

    scene.add(luz2);


    scene.add(
        new THREE.AmbientLight(
            0x806020,
            1.4
        )
    );


    /* -----------------------------------------------
       UNIVERSO
    ------------------------------------------------ */

    universo=
    new THREE.Group();

    scene.add(
        universo
    );


    /* -----------------------------------------------
       PLANETA CENTRAL
    ------------------------------------------------ */

    crearCentro();


    /* -----------------------------------------------
       ORBITAS
    ------------------------------------------------ */

    crearOrbitas();


    /* -----------------------------------------------
       FLORES
    ------------------------------------------------ */

    crearFlores();


    /* -----------------------------------------------
       MENSAJES
    ------------------------------------------------ */

    crearMensajes();


    /* -----------------------------------------------
       ESTRELLAS
    ------------------------------------------------ */

    crearEstrellas();


    /* -----------------------------------------------
       EVENTOS
    ------------------------------------------------ */

    configurarControles();


    /* -----------------------------------------------
       ANIMAR
    ------------------------------------------------ */

    animar();

}


/* =====================================================
   CENTRO NEGRO
===================================================== */

function crearCentro(){


    const grupo=
    new THREE.Group();


    /* -----------------------------------------------
       ESFERA
    ------------------------------------------------ */

    const geo=
    new THREE.SphereGeometry(
        1.15,
        32,
        32
    );


    const mat=
    new THREE.MeshStandardMaterial({

        color:0x030303,

        roughness:.25,

        metalness:.8

    });


    const esfera=
    new THREE.Mesh(
        geo,
        mat
    );


    grupo.add(
        esfera
    );


    /* -----------------------------------------------
       ANILLO
    ------------------------------------------------ */

    const geoAnillo=
    new THREE.TorusGeometry(

        2.0,

        .18,

        16,

        100

    );


    const matAnillo=
    new THREE.MeshBasicMaterial({

        color:0xffdd22

    });


    const anillo=
    new THREE.Mesh(
        geoAnillo,
        matAnillo
    );


    anillo.rotation.x=
    Math.PI/2.4;


    grupo.add(
        anillo
    );


    /* -----------------------------------------------
       GLOW
    ------------------------------------------------ */

    const glowGeo=
    new THREE.TorusGeometry(

        2.0,

        .33,

        16,

        100

    );


    const glowMat=
    new THREE.MeshBasicMaterial({

        color:0xffaa00,

        transparent:true,

        opacity:.22

    });


    const glow=
    new THREE.Mesh(
        glowGeo,
        glowMat
    );


    glow.rotation.x=
    Math.PI/2.4;


    grupo.add(
        glow
    );


    universo.add(
        grupo
    );

}


/* =====================================================
   ORBITAS
===================================================== */

function crearOrbitas(){


    const radios=[
        3.0,
        4.2,
        5.5,
        6.7
    ];


    radios.forEach(
        function(radio){

            const geo=
            new THREE.TorusGeometry(

                radio,

                .012,

                8,

                120

            );


            const mat=
            new THREE.MeshBasicMaterial({

                color:0xffcc22,

                transparent:true,

                opacity:.10

            });


            const orbita=
            new THREE.Mesh(
                geo,
                mat
            );


            orbita.rotation.x=
            Math.PI/2;


            universo.add(
                orbita
            );

        }
    );

}


/* =====================================================
   CREAR FLOR 3D
===================================================== */

function crearFlor3D(){


    const flor=
    new THREE.Group();


    const cantidad=
    10;


    /* -----------------------------------------------
       PETALOS
    ------------------------------------------------ */

    for(
        let i=0;
        i<cantidad;
        i++
    ){

        const geo=
        new THREE.SphereGeometry(

            .42,

            12,

            8

        );


        geo.scale(
            .55,
            1.3,
            .18
        );


        const colores=[
            0xffd21c,
            0xffc400,
            0xffe04a,
            0xffb900
        ];


        const mat=
        new THREE.MeshStandardMaterial({

            color:
            colores[
                Math.floor(
                    Math.random()*
                    colores.length
                )
            ],

            emissive:0x6a3b00,

            emissiveIntensity:.25,

            roughness:.55

        });


        const petalo=
        new THREE.Mesh(
            geo,
            mat
        );


        const angulo=
        i*
        Math.PI*2/
        cantidad;


        petalo.position.x=
        Math.cos(angulo)*.34;


        petalo.position.y=
        Math.sin(angulo)*.34;


        petalo.rotation.z=
        angulo;


        flor.add(
            petalo
        );

    }


    /* -----------------------------------------------
       CENTRO
    ------------------------------------------------ */

    const centroGeo=
    new THREE.SphereGeometry(

        .28,

        16,

        16

    );


    const centroMat=
    new THREE.MeshStandardMaterial({

        color:0x4b2500,

        roughness:.8

    });


    const centro=
    new THREE.Mesh(
        centroGeo,
        centroMat
    );


    centro.position.z=.2;


    flor.add(
        centro
    );


    return flor;

}


/* =====================================================
   FLORES ORBITANDO
===================================================== */

function crearFlores(){


    const cantidad=
    55;


    for(
        let i=0;
        i<cantidad;
        i++
    ){


        const flor=
        crearFlor3D();


        const radio=
        3+
        Math.random()*4;


        const angulo=
        Math.random()*
        Math.PI*2;


        /* -------------------------------------------
           POSICION 3D
        ------------------------------------------- */

        flor.position.x=
        Math.cos(angulo)*
        radio;


        flor.position.z=
        Math.sin(angulo)*
        radio;


        flor.position.y=
        (Math.random()-.5)*
        1.5;


        /* -------------------------------------------
           TAMAÑO
        ------------------------------------------- */

        const escala=
        .35+
        Math.random()*
        .7;


        flor.scale.set(
            escala,
            escala,
            escala
        );


        /* -------------------------------------------
           DATOS
        ------------------------------------------- */

        flor.userData={

            radio:radio,

            angulo:angulo,

            velocidad:
            .0015+
            Math.random()*.004,

            fase:
            Math.random()*
            Math.PI*2

        };


        universo.add(
            flor
        );


        flores.push(
            flor
        );

    }

}


/* =====================================================
   CREAR TEXTO COMO SPRITE
===================================================== */

function crearTexto(texto){


    const canvas=
    document.createElement(
        "canvas"
    );


    canvas.width=512;

    canvas.height=128;


    const ctx=
    canvas.getContext(
        "2d"
    );


    ctx.clearRect(
        0,
        0,
        512,
        128
    );


    ctx.font=
    "bold 34px Segoe UI";


    ctx.textAlign=
    "center";


    ctx.textBaseline=
    "middle";


    /* GLOW */

    ctx.shadowColor=
    "#ffd000";

    ctx.shadowBlur=
    18;


    ctx.fillStyle=
    "#fff9c0";


    ctx.fillText(
        texto,
        256,
        64
    );


    const textura=
    new THREE.CanvasTexture(
        canvas
    );


    textura.needsUpdate=
    true;


    const material=
    new THREE.SpriteMaterial({

        map:textura,

        transparent:true

    });


    const sprite=
    new THREE.Sprite(
        material
    );


    sprite.scale.set(
        2.5,
        .63,
        1
    );


    return sprite;

}


/* =====================================================
   MENSAJES ORBITANDO
===================================================== */

function crearMensajes(){


    const textos=[

        "Pura luz ✨",

        "Sonríe siempre 🌻",

        "Feliz día",

        "Solo para ti 💛",

        "Flores para ti",

        "Alegras mi vida",

        "Un detalle amarillo",

        "Eres magia ✨",

        "Luz en mi vida",

        "Feliz día 🌼",

        "Sonríe siempre",

        "Pura alegría 💛",

        "Que nunca dejes de florecer",

        "Un detalle especial 🌻",

        "Brilla siempre ✨",

        "Flores para ti 💛"

    ];


    for(
        let i=0;
        i<textos.length;
        i++
    ){


        const texto=
        crearTexto(
            textos[i]
        );


        const radio=
        3.2+
        Math.random()*3.5;


        const angulo=
        Math.random()*
        Math.PI*2;


        texto.position.x=
        Math.cos(angulo)*
        radio;


        texto.position.z=
        Math.sin(angulo)*
        radio;


        texto.position.y=
        (Math.random()-.5)*
        1.2;


        const escala=
        .7+
        Math.random()*.7;


        texto.scale.multiplyScalar(
            escala
        );


        texto.userData={

            radio:radio,

            angulo:angulo,

            velocidad:
            .001+
            Math.random()*.003

        };


        universo.add(
            texto
        );


        mensajes.push(
            texto
        );

    }

}


/* =====================================================
   ESTRELLAS
===================================================== */

function crearEstrellas(){


    const cantidad=
    1800;


    const posiciones=
    new Float32Array(
        cantidad*3
    );


    for(
        let i=0;
        i<cantidad;
        i++
    ){

        posiciones[i*3]=
        (Math.random()-.5)*30;


        posiciones[i*3+1]=
        (Math.random()-.5)*18;


        posiciones[i*3+2]=
        (Math.random()-.5)*25;

    }


    const geo=
    new THREE.BufferGeometry();


    geo.setAttribute(

        "position",

        new THREE.BufferAttribute(
            posiciones,
            3
        )

    );


    const mat=
    new THREE.PointsMaterial({

        color:0xffffff,

        size:.035,

        transparent:true,

        opacity:.85

    });


    estrellas=
    new THREE.Points(
        geo,
        mat
    );


    scene.add(
        estrellas
    );

}


/* =====================================================
   CONTROLES
===================================================== */

function configurarControles(){


    const canvas=
    renderer.domElement;


    /* -----------------------------------------------
       MOUSE
    ----------------------------------------------- */

    canvas.addEventListener(

        "mousedown",

        function(e){

            arrastrando=true;

            autoRotacion=false;

            anteriorX=e.clientX;

            anteriorY=e.clientY;

        }

    );


    canvas.addEventListener(

        "mousemove",

        function(e){

            if(!arrastrando)
                return;


            const dx=
            e.clientX-
            anteriorX;


            const dy=
            e.clientY-
            anteriorY;


            universo.rotation.y +=
            dx*.006;


            universo.rotation.x +=
            dy*.003;


            anteriorX=
            e.clientX;


            anteriorY=
            e.clientY;

        }

    );


    canvas.addEventListener(

        "mouseup",

        function(){

            arrastrando=false;

            autoRotacion=true;

        }

    );


    /* -----------------------------------------------
       TOUCH
    ----------------------------------------------- */

    canvas.addEventListener(

        "touchstart",

        function(e){

            autoRotacion=false;


            if(
                e.touches.length===1
            ){

                anteriorX=
                e.touches[0].clientX;

                anteriorY=
                e.touches[0].clientY;

            }


            if(
                e.touches.length===2
            ){

                distanciaInicial=
                distancia(
                    e.touches[0],
                    e.touches[1]
                );

                zoomInicial=
                camera.position.z;

            }

        },

        {passive:false}

    );


    canvas.addEventListener(

        "touchmove",

        function(e){

            e.preventDefault();


            /* ---------------------------------------
               UN DEDO = GIRAR
            --------------------------------------- */

            if(
                e.touches.length===1
            ){

                const x=
                e.touches[0].clientX;

                const y=
                e.touches[0].clientY;


                const dx=
                x-anteriorX;

                const dy=
                y-anteriorY;


                universo.rotation.y +=
                dx*.006;


                universo.rotation.x +=
                dy*.004;


                anteriorX=x;

                anteriorY=y;

            }


            /* ---------------------------------------
               DOS DEDOS = ZOOM
            --------------------------------------- */

            if(
                e.touches.length===2
            ){

                const nuevaDistancia=
                distancia(
                    e.touches[0],
                    e.touches[1]
                );


                const diferencia=
                nuevaDistancia-
                distanciaInicial;


                camera.position.z=
                zoomInicial-
                diferencia*.012;


                camera.position.z=
                Math.max(
                    5,
                    Math.min(
                        18,
                        camera.position.z
                    )
                );

            }

        },

        {passive:false}

    );


    canvas.addEventListener(

        "touchend",

        function(){

            autoRotacion=true;

        }

    );

}


/* =====================================================
   DISTANCIA ENTRE DOS DEDOS
===================================================== */

function distancia(a,b){

    const dx=
    a.clientX-
    b.clientX;


    const dy=
    a.clientY-
    b.clientY;


    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}


/* =====================================================
   ANIMACIÓN
===================================================== */

function animar(){


    requestAnimationFrame(
        animar
    );


    /* -----------------------------------------------
       GIRO AUTOMÁTICO
    ----------------------------------------------- */

    if(
        autoRotacion
    ){

        universo.rotation.y +=
        .0025;

    }


    /* -----------------------------------------------
       FLORES
    ----------------------------------------------- */

    flores.forEach(

        function(flor){

            flor.userData.angulo +=
            flor.userData.velocidad;


            const a=
            flor.userData.angulo;

            const r=
            flor.userData.radio;


            flor.position.x=
            Math.cos(a)*r;


            flor.position.z=
            Math.sin(a)*r;


            flor.position.y +=
            Math.sin(
                a+
                flor.userData.fase
            )*.002;


            flor.rotation.z +=
            .003;

        }

    );


    /* -----------------------------------------------
       MENSAJES
    ----------------------------------------------- */

    mensajes.forEach(

        function(texto){

            texto.userData.angulo +=
            texto.userData.velocidad;


            const a=
            texto.userData.angulo;

            const r=
            texto.userData.radio;


            texto.position.x=
            Math.cos(a)*r;


            texto.position.z=
            Math.sin(a)*r;


            texto.position.y +=
            Math.sin(a)*.0015;

        }

    );


    /* -----------------------------------------------
       ESTRELLAS
    ----------------------------------------------- */

    estrellas.rotation.y +=
    .00015;


    /* -----------------------------------------------
       RENDER
    ----------------------------------------------- */

    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   REDIMENSIONAR
===================================================== */

window.addEventListener(

    "resize",

    function(){

        camera.aspect=
        window.innerWidth/
        window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);


/* =====================================================
   REINICIAR
===================================================== */

boton.addEventListener(

    "click",

    function(){

        location.reload();

    }

);

</script>

</body>
</html>
